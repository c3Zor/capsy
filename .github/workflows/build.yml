name: Build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          devices = [d for devs in data['devices'].values() for d in devs
                     if d.get('isAvailable') and 'iPhone' in d['name']]
          print(devices[-1]['udid'])")
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build (iOS Simulator, be pasirašymo)
        run: |
          if ! xcodebuild build \
            -project Capsy.xcodeproj \
            -scheme Capsy \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1; then
            echo "BUILD FAILED — klaidos:"
            grep -E "error:" build.log | head -40
            exit 65
          fi
          tail -5 build.log

      - name: Unit tests
        run: |
          if ! xcodebuild test \
            -project Capsy.xcodeproj \
            -scheme Capsy \
            -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1; then
            echo "TESTS FAILED — klaidos:"
            grep -E "error:|failed" test.log | head -40
            exit 65
          fi
          tail -5 test.log

      # Vizualinis self-check: pilna matrica — visi ekranai, abi temos,
      # skirtingi užpildymo lygiai. Nuotraukos komitinamos į /screenshots.
      - name: Screenshot self-check
        if: github.event_name == 'push'
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/Build/Products -name 'Capsy.app' -type d | head -1)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots
          shot () { # name, args...
            local name="$1"; shift
            xcrun simctl terminate "$UDID" com.capsy.app 2>/dev/null || true
            xcrun simctl launch "$UDID" com.capsy.app "$@"
            sleep 9
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }
          shot home        --demo
          shot home-night  --demo --night
          shot home-full   --demo --fill-full
          shot ritual      --demo --screen ritual
          shot shop        --demo --screen shop
          shot habits      --demo --screen habits
          shot journey     --demo --screen journey
          shot paywall     --demo --screen paywall

      - name: Commit generated project + screenshots
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Capsy.xcodeproj \
            Capsy/Info.plist Capsy/Capsy.entitlements \
            CapsyWidget/Info.plist CapsyWidget/CapsyWidget.entitlements \
            screenshots/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "CI: projektas + ekrano nuotrauka [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push
