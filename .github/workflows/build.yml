name: Build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (iOS Simulator, be pasirašymo)
        run: |
          xcodebuild build \
            -project Capsy.xcodeproj \
            -scheme Capsy \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tail -100
          exit ${PIPESTATUS[0]}

      # Sėkmingai subuildintas .xcodeproj IR visi XcodeGen sugeneruoti failai
      # (Info.plist, entitlements) įkomitinami atgal — vartotojui nereikia
      # xcodegen: tiesiog clone → open Capsy.xcodeproj → Run.
      - name: Commit generated project
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Capsy.xcodeproj \
            Capsy/Info.plist Capsy/Capsy.entitlements \
            CapsyWidget/Info.plist CapsyWidget/CapsyWidget.entitlements
          git diff --cached --quiet || { git commit -m "CI: sugeneruotas Xcode projektas [skip ci]"; git push; }
